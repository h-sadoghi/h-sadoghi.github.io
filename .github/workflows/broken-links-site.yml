name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

jobs:
  check-links-on-site:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-a-workflow-based-on-the-conclusion-of-another-workflow
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Setup Python for Jupyter Book
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/jupyterbook_manager/requirements*.txt
      - name: Install Jupyter Book dependencies
        run: python -m pip install -r tools/jupyterbook_manager/requirements-ci.txt
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install and verify ImageMagick WebP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          command -v convert
          convert -version
          convert -list format | grep -E '^[[:space:]]*WEBP\*?[[:space:]]'
          webp_test="$(mktemp "${RUNNER_TEMP}/imagemagick-XXXXXX.webp")"
          trap 'rm -f "$webp_test"' EXIT
          convert -size 1x1 xc:white "$webp_test"
          test -s "$webp_test"
      - name: Install and Build 🔧
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Build and stage Image Processing Jupyter Book
        run: |
          python -m tools.jupyterbook_manager --repo "$GITHUB_WORKSPACE" build --book image-processing --clean
          python -m tools.jupyterbook_manager --repo "$GITHUB_WORKSPACE" stage --book image-processing --site-dir _site
      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # only check local links
          args: --offline --remap '_site(/?.*)/assets/(.*) _site/assets/$2' --verbose --no-progress '_site/**/*.html'
