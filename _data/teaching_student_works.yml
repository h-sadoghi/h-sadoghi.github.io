  - id: svd-low-rank-separable-convolution
    course_id: image-processing
    title: Low-Rank Approximation of 2-D Convolution Filters Using SVD
    summary: This student project studies how singular value decomposition (SVD) can approximate a non-separable 2-D convolution kernel with lower-rank
      separable filters. The package includes a Persian report, Python implementation, numerical results, and example figures comparing full filtering
      with rank-1, rank-2, and rank-4 approximations. It is directly relevant to image processing topics such as spatial filtering, separability,
      computational efficiency, and approximation error.
